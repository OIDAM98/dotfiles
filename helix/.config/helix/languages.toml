# Configured to run alongside marksman.
[[language]]
language-servers = ["marksman", "mpls", "ltex-ls-plus"]
comment-tokens = ["-", "+", "*", "- [ ]", ">"]
soft-wrap.enable = true
soft-wrap.wrap-at-text-width = true
name = "markdown"
formatter = { command = 'prettier', args = [
  "--parser",
  "markdown",
  "--prose-wrap",
  "never", # <always|never|preserve>
] }
auto-format = true

[language-server.mpls]
command = "mpls"
args = ["--dark-mode", "--enable-emoji"]
# An example args entry showing how to specify flags with values:
# args = ["--port", "8080", "--browser", "google-chrome"]

[[language]]
name = "sql"
indent = { tab-width = 2, unit = "  " }
language-servers = ["sqruff"]
# Dialect comes from ~/.config/sqruff/.sqruff (snowflake) or a project .sqruff.
# sqruff writes its lint report to stderr, and Helix treats any stderr output as a
# formatter failure, so drop it. stdout is only the formatted SQL.
formatter = { command = "sh", args = ["-c", "sqruff fix - 2>/dev/null"] }
auto-format = false # format on demand with `:format`

[language-server.sqruff]
command = "sqruff"
args = ["lsp"]

[[language]]
name = "yaml"
indent = { tab-width = 2, unit = "  " }
language-servers = ["yaml-language-server"]

[language-server.yaml-language-server.config.yaml]
format = { enable = true }
validate = true

[[language]]
name = "python"
language-servers = ["pylsp", "ruff"]
auto-format = false
scope = "source.python"
comment-token = "#"
roots = [".", "pyproject.toml", "pyrightconfig.json"]
formatter = { command = 'ruff', args = [
  "format",
  "-"
] }

# [[language-server.ruff]]
# command = "ruff"
# args = ["format", '-']

[language-server.pylsp.config.pylsp.plugins]
pylsp_mypy.enabled = true
pylsp_mypy.live_mode = false
rope_autoimport.enabled = true
pycodestyle.enabled = false
pyflakes.enabled = false
mccabe.enabled = false
autopep8.enabled = false
yapf.enabled = false
