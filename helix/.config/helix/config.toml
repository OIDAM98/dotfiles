theme = "starlight"

[editor]
line-number = "relative"
color-modes = true
true-color = true
bufferline = "multiple"

[editor.statusline]
left = ["mode", "spinner", "register"]
center = ["file-name", "read-only-indicator", "total-line-numbers"]
right = ["version-control", "diagnostics", "selections", "position", "file-encoding"]
separator = "|"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = true

[editor.whitespace]
render = "all"

[editor.whitespace.characters]
space = "·"
nbsp = "⍽"
tab = "→"
newline = "⏎"
tabpad = "·" # Tabs will look like "→···" (depending on tab width)

[editor.indent-guides]
render = true

[keys.normal]
esc = ["collapse_selection", "keep_primary_selection"]
g = { a = "code_action" } # Maps `ga` to show possible code actions
C-s = ":w" # Maps Ctrl-s to the typable command :w which is an alias for :write (save file)
C-o = ":open ~/.config/helix/config.toml" # Maps Ctrl-o to opening of the helix config file
"C-S-esc" = "extend_line" # Maps Ctrl-Shift-Escape to extend_line
"ret" = ["open_below", "normal_mode"] # Maps the enter key to open_below then re-enter normal mode

[keys.normal.space]
x = ":toggle whitespace.render all none" # Toggles whitespace characters
l = [
    ":write-all",
    ":insert-output lazygit >/dev/tty",
    ":redraw",
    ":reload-all",
    ":set mouse false",
    ":set mouse true",
]

e = [
  ":sh rm -f /tmp/unique-file-h21a434",
  ":insert-output yazi '%{buffer_name}' --chooser-file=/tmp/unique-file-h21a434",
  ":insert-output echo \"x1b[?1049h\" > /dev/tty",
  ":open %sh{cat /tmp/unique-file-h21a434}",
  ":redraw",
  ":reload-all",
  ":sh clear",
]

[keys.normal.space.t]
s = ":toggle soft-wrap.enable"
"1" = ":theme bogster" # Change theme to bogster
"2" = ":theme starlight" # Change theme to bogster
"3" = ":theme everforest_light" # Change theme to bogster
